<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MistyStep</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="MistyStep.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
<link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/TG.Blazor.IndexedDB/indexedDb.Blazor.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

    <script>
        window.mistyStepDbPut = async (storeName, record) => {
            const request = indexedDB.open("MistyStep", 1);
            const database = await new Promise((resolve, reject) => {
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
            await new Promise((resolve, reject) => {
                const transaction = database.transaction(storeName, "readwrite");
                transaction.objectStore(storeName).put(record);
                transaction.oncomplete = resolve;
                transaction.onerror = () => reject(transaction.error);
            });
            database.close();
        };

        window.mistyStepDbDelete = async (storeName, id) => {
            const request = indexedDB.open("MistyStep", 1);
            const database = await new Promise((resolve, reject) => {
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
            await new Promise((resolve, reject) => {
                const transaction = database.transaction(storeName, "readwrite");
                transaction.objectStore(storeName).delete(id);
                transaction.oncomplete = resolve;
                transaction.onerror = () => reject(transaction.error);
            });
            database.close();
        };

        window.mistyStepWerePredefinedExercisesSeeded = () =>
            localStorage.getItem("mistystep-predefined-exercises-seeded") === "true";

        window.mistyStepMarkPredefinedExercisesSeeded = () =>
            localStorage.setItem("mistystep-predefined-exercises-seeded", "true");

        window.downloadMistyStepFile = (fileName, base64) => {
            const bytes = Uint8Array.from(atob(base64), character => character.charCodeAt(0));
            const url = URL.createObjectURL(new Blob([bytes], { type: "application/json" }));
            const link = document.createElement("a");
            link.href = url;
            link.download = fileName;
            link.click();
            URL.revokeObjectURL(url);
        };

        window.clickMistyStepFileInput = inputId => {
            document.getElementById(inputId)?.click();
        };

        window.mistyStepGetThemeMode = () => {
            const mode = localStorage.getItem("mistystep-theme-mode");
            return ["system", "light", "dark"].includes(mode) ? mode : "system";
        };

        window.mistyStepResolveTheme = mode => mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);

        window.mistyStepSetThemeMode = mode => {
            if (mode === "system") {
                localStorage.removeItem("mistystep-theme-mode");
                return;
            }

            localStorage.setItem("mistystep-theme-mode", mode);
        };

        window.mistyStepGetLanguage = () => {
            const savedLanguage = localStorage.getItem("mistystep-language");
            if (["da-DK", "en-GB"].includes(savedLanguage)) {
                document.documentElement.lang = savedLanguage;
                return savedLanguage;
            }

            const browserLanguage = (navigator.languages?.[0] || navigator.language || "").toLowerCase();
            const detectedLanguage = browserLanguage.startsWith("da") ? "da-DK" : "en-GB";
            document.documentElement.lang = detectedLanguage;
            return detectedLanguage;
        };

        window.mistyStepSetLanguage = language => {
            localStorage.setItem("mistystep-language", language);
            document.documentElement.lang = language;
        };
    </script>

    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
